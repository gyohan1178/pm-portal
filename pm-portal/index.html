<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JS 포털 | 진선테크</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JS 포털" />
    <!-- 글꼴: Pretendard (public/fonts/pretendard, OFL) — 쓰는 글자 묶음만 그때그때 받는다 -->
    <link rel="stylesheet" href="/fonts/pretendard/pretendardvariable-dynamic-subset.css" />
    <script>
      // GitHub Pages SPA 새로고침 처리
      (function(){
        var redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          if (redirect !== window.location.href) {
            window.history.replaceState(null, null, redirect);
          }
        }
      })();
    </script>
<meta name="mobile-web-app-capable" content="yes">
    <!-- Zebra Browser Print SDK (ZM400 라벨 출력용) — public 폴더에 SDK JS 2개 넣어야 동작 -->
    <script src="/BrowserPrint-3.1.250.min.js"></script>
    <script src="/BrowserPrint-Zebra-1.1.250.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>


<script>(function(){var r=sessionStorage.redirect;if(r){delete sessionStorage.redirect;history.replaceState(null,'',r)}})()</script>
